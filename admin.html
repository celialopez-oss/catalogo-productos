<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Catálogo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">

    <header class="header">
        <div class="logo-container">
            <span class="company-name">Panel Admin</span>
        </div>
        <div class="header-title">
            <h1 id="form-title">Agregar Nuevo Producto</h1>
        </div>
        <div>
            <a href="index.html" class="back-catalogue-btn"><i class="fa-solid fa-store"></i> Ver Catálogo</a>
        </div>
    </header>

    <main class="container admin-container">
        <!-- Formulario para agregar/editar producto -->
        <section class="form-section">
            <form id="product-form" onsubmit="guardarProducto(event)">
                <input type="hidden" id="edit-id">

                <div class="form-group">
                    <label for="codigo">Código del Producto:</label>
                    <input type="text" id="codigo" required placeholder="Ej. PROD-001">
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre del Producto:</label>
                    <input type="text" id="nombre" required placeholder="Ej. Coche paseador">
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría:</label>
                    <input type="text" id="categoria" required placeholder="Ej. Juguetes, Sillas, Lactancia">
                </div>

                <div class="form-group">
                    <label for="precio">Valor / Precio ($):</label>
                    <input type="number" step="0.01" id="precio" required placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="descuento">Descuento (%):</label>
                    <input type="number" id="descuento" value="0" min="0" max="100" placeholder="Ej. 15">
                </div>

                <div class="form-group">
                    <label for="imagen">Enlace de la Foto (URL):</label>
                    <input type="url" id="imagen" required placeholder="https://ejemplo.com/foto.jpg">
                    <small>Sube tu imagen a internet (ej. Imgur) y pega el enlace directo aquí.</small>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" rows="3" required placeholder="Detalles del producto..."></textarea>
                </div>

                <button type="submit" id="submit-btn-text" class="submit-btn"><i class="fa-solid fa-plus"></i> Guardar Producto</button>
                <button type="button" id="cancel-edit-btn" class="cancel-btn" style="display:none; margin-top: 10px;" onclick="cancelarEdicion()">Cancelar Edición</button>
            </form>
        </section>

        <!-- Lista de productos actuales -->
        <section class="list-section">
            <h2>Productos Registrados</h2>
            <div id="admin-product-list" class="admin-list">
                <!-- Se llena mediante JS -->
            </div>
        </section>
    </main>

    <script>
        let productos = JSON.parse(localStorage.getItem('catalogo_productos')) || [];

        function guardarProducto(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            
            const productoData = {
                id: editId ? Number(editId) : Date.now(),
                codigo: document.getElementById('codigo').value.trim(),
                nombre: document.getElementById('nombre').value.trim(),
                categoria: document.getElementById('categoria').value.trim(),
                precio: parseFloat(document.getElementById('precio').value),
                descuento: parseInt(document.getElementById('descuento').value) || 0,
                imagen: document.getElementById('imagen').value.trim(),
                descripcion: document.getElementById('descripcion').value.trim()
            };

            if (editId) {
                // Actualizar existente
                productos = productos.map(p => p.id === Number(editId) ? productoData : p);
                alert('¡Producto actualizado con éxito!');
            } else {
                // Agregar nuevo
                productos.push(productoData);
                alert('¡Producto agregado exitosamente!');
            }

            localStorage.setItem('catalogo_productos', JSON.stringify(productos));
            cancelarEdicion();
            cargarListaAdmin();
        }

        function editarProducto(id) {
            const prod = productos.find(p => p.id === id);
            if (!prod) return;

            document.getElementById('edit-id').value = prod.id;
            document.getElementById('codigo').value = prod.codigo || '';
            document.getElementById('nombre').value = prod.nombre;
            document.getElementById('categoria').value = prod.categoria;
            document.getElementById('precio').value = prod.precio;
            document.getElementById('descuento').value = prod.descuento || 0;
            document.getElementById('imagen').value = prod.imagen;
            document.getElementById('descripcion').value = prod.descripcion;

            document.getElementById('form-title').textContent = "Editar Producto";
            document.getElementById('submit-btn-text').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Actualizar Producto';
            document.getElementById('cancel-edit-btn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicion() {
            document.getElementById('product-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('form-title').textContent = "Agregar Nuevo Producto";
            document.getElementById('submit-btn-text').innerHTML = '<i class="fa-solid fa-plus"></i> Guardar Producto';
            document.getElementById('cancel-edit-btn').style.display = 'none';
        }

        function eliminarProducto(id) {
            if (confirm('¿Estás segura de eliminar este producto?')) {
                productos = productos.filter(p => p.id !== id);
                localStorage.setItem('catalogo_productos', JSON.stringify(productos));
                cargarListaAdmin();
            }
        }

        function cargarListaAdmin() {
            const listContainer = document.getElementById('admin-product-list');
            listContainer.innerHTML = '';
            
            if (productos.length === 0) {
                listContainer.innerHTML = '<p>No hay productos registrados.</p>';
                return;
            }

            productos.forEach(prod => {
                let precioFinal = Number(prod.precio);
                if (prod.descuento > 0) {
                    precioFinal = precioFinal - (precioFinal * prod.descuento / 100);
                }

                const item = document.createElement('div');
                item.className = 'admin-item';
                item.innerHTML = `
                    <img src="${prod.imagen}" width="50" height="50" style="object-fit:cover; border-radius:4px;" onerror="this.src='https://via.placeholder.com/50?text=Img'">
                    <div class="admin-item-info">
                        <strong>[${prod.codigo || 'S/C'}] ${prod.nombre}</strong><br>
                        <small>${prod.categoria} - $${precioFinal.toFixed(2)} ${prod.descuento > 0 ? `(${prod.descuento}% desc.)` : ''}</small>
                    </div>
                    <div class="admin-actions">
                        <button onclick="editarProducto(${prod.id})" class="edit-btn" title="Editar"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="eliminarProducto(${prod.id})" class="delete-btn" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        cargarListaAdmin();
    </script>
</body>
</html>
