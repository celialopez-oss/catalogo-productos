<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Catálogo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

    <header class="header">
        <div class="logo-container">
            <span class="company-name">Panel Admin Privado</span>
        </div>
        <div class="header-title">
            <h1 id="header-title">Acceso Restringido</h1>
        </div>
        <div id="header-actions">
            <a href="index.html" class="back-catalogue-btn"><i class="fa-solid fa-store"></i> Ver Catálogo</a>
        </div>
    </header>

    <!-- INICIO DE SESIÓN -->
    <main class="container" id="login-container" style="max-width: 400px; margin-top: 50px;">
        <div class="form-section">
            <h2>Iniciar Sesión</h2>
            <form id="login-form" onsubmit="iniciarSesion(event)">
                <div class="form-group">
                    <label for="login-email">Correo electrónico:</label>
                    <input type="email" id="login-email" required placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña:</label>
                    <input type="password" id="login-password" required placeholder="********">
                </div>
                <button type="submit" class="submit-btn"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
                <p id="login-error" style="color: red; margin-top: 10px; font-size: 0.9rem; text-align: center;"></p>
            </form>
        </div>
    </main>

    <!-- PANEL DE ADMINISTRACIÓN -->
    <main class="container admin-container" id="admin-main-container" style="display: none;">
        <section class="form-section">
            <h2 id="form-title">Agregar Nuevo Producto</h2>
            <form id="product-form" onsubmit="guardarProducto(event)">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="imagen-actual">

                <div class="form-group">
                    <label for="codigo">Código del Producto:</label>
                    <input type="text" id="codigo" required placeholder="Ej. PROD-001">
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre del Producto:</label>
                    <input type="text" id="nombre" required placeholder="Ej. Coche paseador">
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría:</label>
                    <input type="text" id="categoria" required placeholder="Ej. Juguetes, Sillas">
                </div>

                <div class="form-group">
                    <label for="seccion">Sección:</label>
                    <input type="text" id="seccion" required placeholder="Ej. Niños, Bebés">
                </div>

                <div class="form-group">
                    <label for="precio">Valor / Precio ($):</label>
                    <input type="number" step="0.01" id="precio" required placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="imagen-file">Subir Imagen desde tus Archivos:</label>
                    <input type="file" id="imagen-file" accept="image/*">
                    <small>Selecciona una foto de tu dispositivo.</small>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" rows="3" required placeholder="Detalles del producto..."></textarea>
                </div>

                <button type="submit" id="submit-btn-text" class="submit-btn"><i class="fa-solid fa-plus"></i> Guardar Producto</button>
                <button type="button" id="cancel-edit-btn" class="cancel-btn" style="display:none; margin-top: 10px;" onclick="cancelarEdicion()">Cancelar Edición</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Productos Registrados (Orden Alfabético)</h2>
            <div id="admin-product-list" class="admin-list">
                <p>Cargando lista...</p>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://flzjaeudmnxhhavcvmuo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_KVjojmlQZoC7dFBi3FQTKQ_LfsfpkjI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let productos = [];

        async function verificarSesion() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            manejarVistaSesion(session);

            supabaseClient.auth.onAuthStateChange((event, session) => {
                manejarVistaSesion(session);
            });
        }

        function manejarVistaSesion(session) {
            const loginContainer = document.getElementById('login-container');
            const adminMainContainer = document.getElementById('admin-main-container');
            const headerTitle = document.getElementById('header-title');
            const headerActions = document.getElementById('header-actions');

            if (session) {
                loginContainer.style.display = 'none';
                adminMainContainer.style.display = 'grid';
                headerTitle.textContent = 'Gestión de Productos';
                headerActions.innerHTML = `
                    <button onclick="cerrarSesion()" class="logout-btn" title="Cerrar sesión"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
                    <a href="index.html" class="back-catalogue-btn"><i class="fa-solid fa-store"></i> Ver Catálogo</a>
                `;
                cargarListaAdmin();
            } else {
                loginContainer.style.display = 'block';
                adminMainContainer.style.display = 'none';
                headerTitle.textContent = 'Acceso Restringido';
                headerActions.innerHTML = `<a href="index.html" class="back-catalogue-btn"><i class="fa-solid fa-store"></i> Ver Catálogo</a>`;
            }
        }

        async function iniciarSesion(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');

            errorEl.textContent = 'Iniciando sesión...';
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                errorEl.textContent = 'Correo o contraseña incorrectos.';
            } else {
                errorEl.textContent = '';
            }
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
        }

        async function cargarListaAdmin() {
            const listContainer = document.getElementById('admin-product-list');
            
            // Consultar a Supabase ordenado alfabéticamente por nombre
            const { data, error } = await supabaseClient
                .from('productos')
                .select('*')
                .order('nombre', { ascending: true });

            if (error) {
                console.error('Error al obtener datos:', error);
                listContainer.innerHTML = `<p style="color:red;">Error al cargar: ${error.message}</p>`;
                return;
            }

            productos = data || [];
            listContainer.innerHTML = '';
            
            if (productos.length === 0) {
                listContainer.innerHTML = '<p>No hay productos registrados.</p>';
                return;
            }

            productos.forEach(prod => {
                const precioFinal = Number(prod.precio) || 0;
                const item = document.createElement('div');
                item.className = 'admin-item';
                item.innerHTML = `
                    <img src="${prod.imagen}" width="50" height="50" style="object-fit:cover; border-radius:4px;" onerror="this.src='https://via.placeholder.com/50?text=Img'">
                    <div class="admin-item-info">
                        <strong>[${prod.codigo || 'S/C'}] ${prod.nombre}</strong><br>
                        <small>${prod.categoria} (${prod.seccion || 'Sin sección'}) - $${precioFinal.toFixed(2)}</small>
                    </div>
                    <div class="admin-actions">
                        <button onclick="editarProducto(${prod.id})" class="edit-btn" title="Editar"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="eliminarProducto(${prod.id})" class="delete-btn" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        async function guardarProducto(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const fileInput = document.getElementById('imagen-file');
            let imageUrl = document.getElementById('imagen-actual').value;

            // Si seleccionó un archivo nuevo, lo subimos a Supabase Storage
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileName = `${Date.now()}_${file.name}`;
                
                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('productos-img')
                    .upload(fileName, file);

                if (uploadError) {
                    alert('Error al subir la imagen: ' + uploadError.message);
                    return;
                }

                const { data: publicURLData } = supabaseClient.storage
                    .from('productos-img')
                    .getPublicUrl(fileName);

                imageUrl = publicURLData.publicUrl;
            }

            if (!imageUrl) {
                alert('Por favor selecciona una imagen para el producto.');
                return;
            }

            const productoData = {
                codigo: document.getElementById('codigo').value.trim(),
                nombre: document.getElementById('nombre').value.trim(),
                categoria: document.getElementById('categoria').value.trim(),
                seccion: document.getElementById('seccion').value.trim(),
                precio: parseFloat(document.getElementById('precio').value),
                imagen: imageUrl,
                descripcion: document.getElementById('descripcion').value.trim()
            };

            if (editId) {
                const { error } = await supabaseClient.from('productos').update(productoData).eq('id', Number(editId));
                if (error) { alert('Error al actualizar: ' + error.message); return; }
                alert('¡Producto actualizado con éxito!');
            } else {
                const { error } = await supabaseClient.from('productos').insert([productoData]);
                if (error) { alert('Error al guardar: ' + error.message); return; }
                alert('¡Producto agregado exitosamente!');
            }

            cancelarEdicion();
            cargarListaAdmin();
        }

        function editarProducto(id) {
            const prod = productos.find(p => p.id === id);
            if (!prod) return;

            document.getElementById('edit-id').value = prod.id;
            document.getElementById('imagen-actual').value = prod.imagen;
            document.getElementById('codigo').value = prod.codigo || '';
            document.getElementById('nombre').value = prod.nombre;
            document.getElementById('categoria').value = prod.categoria;
            document.getElementById('seccion').value = prod.seccion || '';
            document.getElementById('precio').value = prod.precio;
            document.getElementById('descripcion').value = prod.descripcion;

            document.getElementById('form-title').textContent = "Editar Producto";
            document.getElementById('submit-btn-text').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Actualizar Producto';
            document.getElementById('cancel-edit-btn').style.display = 'block';
            window.scrollTo({ top: { top: 0, behavior: 'smooth' } });
        }

        function cancelarEdicion() {
            document.getElementById('product-form').reset();
            document.getElementById('edit-id').value = '';
            document.getElementById('imagen-actual').value = '';
            document.getElementById('form-title').textContent = "Agregar Nuevo Producto";
            document.getElementById('submit-btn-text').innerHTML = '<i class="fa-solid fa-plus"></i> Guardar Producto';
            document.getElementById('cancel-edit-btn').style.display = 'none';
        }

        async function eliminarProducto(id) {
            if (confirm('¿Estás segura de eliminar este producto?')) {
                const { error } = await supabaseClient.from('productos').delete().eq('id', id);
                if (error) { alert('Error al eliminar: ' + error.message); return; }
                cargarListaAdmin();
            }
        }

        verificarSesion();
    </script>
</body>
</html>
