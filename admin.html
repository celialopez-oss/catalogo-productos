<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Catálogo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">

    <header class="header">
        <div class="logo-container">
            <span class="company-name">Panel Admin</span>
        </div>
        <div class="header-title">
            <h1>Gestión de Productos</h1>
        </div>
        <div>
            <a href="index.html" class="back-catalogue-btn"><i class="fa-solid fa-store"></i> Ver Catálogo</a>
        </div>
    </header>

    <main class="container admin-container">
        <!-- Formulario para agregar producto -->
        <section class="form-section">
            <h2>Agregar Nuevo Producto</h2>
            <form id="product-form" onsubmit="agregarProducto(event)">
                <div class="form-group">
                    <label for="nombre">Nombre del Producto:</label>
                    <input type="text" id="nombre" required placeholder="Ej. Coche paseador">
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría:</label>
                    <input type="text" id="categoria" required placeholder="Ej. Juguetes, Sillas, Lactancia">
                </div>

                <div class="form-group">
                    <label for="precio">Valor ($):</label>
                    <input type="number" step="0.01" id="precio" required placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="descuento">Descuento (% opcional):</label>
                    <input type="number" id="descuento" value="0" min="0" max="100" placeholder="Ej. 10">
                </div>

                <div class="form-group">
                    <label for="imagen">Enlace de la Foto (URL):</label>
                    <input type="url" id="imagen" required placeholder="https://ejemplo.com/foto.jpg">
                    <small>Puedes subir tu foto a Imgur o usar un enlace web directo.</small>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" rows="3" required placeholder="Detalles del producto..."></textarea>
                </div>

                <button type="submit" class="submit-btn"><i class="fa-solid fa-plus"></i> Guardar Producto</button>
            </form>
        </section>

        <!-- Lista de productos actuales para eliminar si se desea -->
        <section class="list-section">
            <h2>Productos Registrados</h2>
            <div id="admin-product-list" class="admin-list">
                <!-- Se llena mediante JS -->
            </div>
        </section>
    </main>

    <script>
        let productos = JSON.parse(localStorage.getItem('catalogo_productos')) || [];

        function agregarProducto(e) {
            e.preventDefault();
            const nuevo = {
                id: Date.now(),
                nombre: document.getElementById('nombre').value,
                categoria: document.getElementById('categoria').value.trim(),
                precio: parseFloat(document.getElementById('precio').value),
                descuento: parseInt(document.getElementById('descuento').value) || 0,
                imagen: document.getElementById('imagen').value,
                descripcion: document.getElementById('descripcion').value
            };

            productos.push(nuevo);
            localStorage.setItem('catalogo_productos', JSON.stringify(productos));
            alert('¡Producto agregado exitosamente!');
            document.getElementById('product-form').reset();
            cargarListaAdmin();
        }

        function eliminarProducto(id) {
            if (confirm('¿Estás segura de eliminar este producto?')) {
                productos = productos.filter(p => p.id !== id);
                localStorage.setItem('catalogo_productos', JSON.stringify(productos));
                cargarListaAdmin();
            }
        }

        function cargarListaAdmin() {
            const listContainer = document.getElementById('admin-product-list');
            listContainer.innerHTML = '';
            
            if (productos.length === 0) {
                listContainer.innerHTML = '<p>No hay productos registrados.</p>';
                return;
            }

            productos.forEach(prod => {
                const item = document.createElement('div');
                item.className = 'admin-item';
                item.innerHTML = `
                    <img src="${prod.imagen}" width="50" height="50" style="object-fit:cover; border-radius:4px;">
                    <div class="admin-item-info">
                        <strong>${prod.nombre}</strong> (${prod.categoria}) - $${prod.precio}
                    </div>
                    <button onclick="eliminarProducto(${prod.id})" class="delete-btn"><i class="fa-solid fa-trash"></i></button>
                `;
                listContainer.appendChild(item);
            });
        }

        cargarListaAdmin();
    </script>
</body>
</html>
