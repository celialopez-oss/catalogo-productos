name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar archivos del proyecto
        run: |
          echo "Verificando estructura de archivos estáticos..."
          ls -la

      - name: Build
        run: echo "Compilación completada exitosamente"
