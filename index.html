<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo 2026</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <img src="logo.png" alt="Logo Compañía" class="logo" onerror="this.src='https://via.placeholder.com/60?text=LOGO'">
            <span class="company-name">Mi Compañía</span>
        </div>
        <div class="header-title">
            <h1>Catálogo 2026</h1>
        </div>
        <!-- Aquí ya no hay ningún enlace de Admin -->
    </header>

    <main class="container">
        <section class="categories-section">
            <h2>Categorías</h2>
            <div id="category-filters" class="category-buttons"></div>
        </section>

        <section class="products-section">
            <h2 id="current-category-title">Todos los Productos</h2>
            <div id="product-grid" class="product-grid">
                <p class="loading-text">Cargando productos...</p>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://flzjaeudmnxhhavcvmuo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_KVjojmlQZoC7dFBi3FQTKQ_LfsfpkjI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const numeroWhatsApp = "593999999999"; // Tu número de WhatsApp
        let productos = [];

        async function cargarProductos() {
            const { data, error } = await supabaseClient.from('productos').select('*');
            if (error) {
                console.error('Error al cargar:', error);
                document.getElementById('product-grid').innerHTML = '<p class="no-products">Error al conectar con la base de datos.</p>';
                return;
            }
            productos = data || [];
            renderCategories();
            filtrarProductos('Todos');
        }

        function renderCategories() {
            const container = document.getElementById('category-filters');
            const categorias = ['Todos', ...new Set(productos.map(p => p.categoria))];
            
            container.innerHTML = '';
            categorias.forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${index === 0 ? 'active' : ''}`;
                btn.textContent = cat;
                btn.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filtrarProductos(cat);
                };
                container.appendChild(btn);
            });
        }

        function filtrarProductos(categoria) {
            const grid = document.getElementById('product-grid');
            const title = document.getElementById('current-category-title');
            title.textContent = categoria === 'Todos' ? 'Todos los Productos' : categoria;
            
            const filtrados = categoria === 'Todos' ? productos : productos.filter(p => p.categoria === categoria);
            
            grid.innerHTML = '';
            if (filtrados.length === 0) {
                grid.innerHTML = '<p class="no-products">No hay productos en esta categoría.</p>';
                return;
            }

            filtrados.forEach(prod => {
                const precioFinal = Number(prod.precio) || 0;
                const mensajeWp = encodeURIComponent(`Hola, estoy interesado/a en el producto [Cód: ${prod.codigo || 'N/D'}] *${prod.nombre}* con valor de $${precioFinal.toFixed(2)}. ¿Me da más información?`);
                const linkWp = `https://wa.me/${numeroWhatsApp}?text=${mensajeWp}`;

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="image-container">
                        <img src="${prod.imagen}" alt="${prod.nombre}" onerror="this.src='https://via.placeholder.com/300?text=Sin+Imagen'">
                    </div>
                    <div class="product-info">
                        <div class="product-top-info">
                            <span class="product-category-tag">${prod.categoria} ${prod.seccion ? `(${prod.seccion})` : ''}</span>
                            ${prod.codigo ? `<span class="product-code-tag">Cód: ${prod.codigo}</span>` : ''}
                        </div>
                        <h3>${prod.nombre}</h3>
                        <p class="description">${prod.descripcion}</p>
                        <div class="price-box">
                            <span class="current-price">$${precioFinal.toFixed(2)}</span>
                        </div>
                        <a href="${linkWp}" target="_blank" class="whatsapp-btn">
                            <i class="fa-brands fa-whatsapp"></i> Preguntar / Comprar
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        cargarProductos();
    </script>
</body>
</html>
